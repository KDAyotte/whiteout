<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whiteout — Kessel Ridge Station</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0f13">
<style>
  :root { --ui:#151a21ee; --ink:#e9eef4; --mute:#9aa6b4; --acc:#ffb347; --good:#7fd18b; --bad:#ff7a6b; --cold:#8fc9ff; --goal:#ffd75e; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0c0f13; font-family:"Segoe UI",system-ui,sans-serif; color:var(--ink); }
  canvas#gl { display:block; width:100vw; height:100vh; }
  .panel { position:absolute; background:var(--ui); border:1px solid #2b3440; border-radius:10px; box-shadow:0 6px 24px #0008; }
  button { background:#26303c; color:var(--ink); border:1px solid #3a4655; border-radius:7px; padding:6px 11px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover:not(:disabled) { background:#33404f; border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:#b5651d; border-color:#e08a3a; font-weight:600; }
  button.primary:hover:not(:disabled) { background:#cf7624; }

  #top { top:12px; left:12px; padding:8px 12px; display:flex; gap:8px; align-items:center; }
  #top h1 { font-size:16px; margin:0 8px 0 0; letter-spacing:.06em; }

  /* status (left) */
  #status { top:64px; left:12px; width:280px; padding:12px; display:flex; flex-direction:column; gap:10px; max-height:calc(100vh - 140px); }
  #status .who { display:flex; justify-content:space-between; align-items:baseline; }
  #status .who b { font-size:16px; }
  #status .who span { color:var(--mute); font-size:12px; }
  .meters { display:grid; grid-template-columns:auto 1fr; gap:3px 8px; font-size:12.5px; align-items:center; }
  .pips { display:flex; gap:3px; }
  .pip { width:15px; height:11px; border-radius:3px; background:#2a323c; }
  .storm { font-size:12.5px; color:var(--cold); }
  .goals { font-size:12.5px; line-height:1.6; border-top:1px solid #2b3440; padding-top:8px; }
  .goals .done { color:var(--good); } .goals .todo { color:var(--mute); }
  #log { flex:1; min-height:80px; overflow-y:auto; font-size:12.5px; line-height:1.45; border-top:1px solid #2b3440; padding-top:8px; }
  #log div { margin-bottom:3px; }
  #log .good { color:var(--good); } #log .bad { color:var(--bad); } #log .cold { color:var(--cold); } #log .goal { color:var(--goal); font-weight:600; } #log .sys { color:var(--mute); font-style:italic; }

  /* actions (right) */
  #actions { top:12px; right:12px; width:290px; padding:12px; display:flex; flex-direction:column; gap:8px; max-height:calc(100vh - 150px); overflow-y:auto; }
  #actions h3 { margin:2px 0 0; font-size:11px; letter-spacing:.14em; color:var(--mute); font-weight:600; }
  #actions .here { font-size:15px; }
  #actions .here small { display:block; color:var(--mute); font-size:12px; }
  #actions .apips { display:flex; gap:5px; align-items:center; font-size:12px; color:var(--mute); }
  #actions .apip { width:20px; height:20px; border-radius:50%; background:#2a323c; border:2px solid #3a4655; }
  #actions .apip.on { background:var(--acc); border-color:#ffd59a; }
  .opt { display:flex; flex-direction:column; align-items:flex-start; text-align:left; width:100%; padding:7px 10px; }
  .opt .l { font-weight:600; font-size:13.5px; }
  .opt .s { font-size:11.5px; color:var(--mute); }
  .opt.move .l::before { content:'➜ '; color:var(--cold); }
  #endround { padding:10px; font-size:14px; }

  #hand { bottom:12px; right:12px; padding:8px 10px 6px; display:flex; gap:8px; align-items:flex-end; }
  #hand .lbl { writing-mode:vertical-rl; transform:rotate(180deg); font-size:11px; color:var(--mute); letter-spacing:.15em; }
  #hand img { width:76px; border-radius:6px; cursor:pointer; transition:transform .15s; }
  #hand img:hover { transform:translateY(-14px) scale(1.15); }
  #hand .empty { font-size:12px; color:var(--mute); padding:20px 10px; }

  #preview { right:316px; top:12px; width:240px; padding:8px; display:none; pointer-events:none; }
  #preview img { width:100%; border-radius:8px; display:block; }
  #preview .cap { font-size:12px; color:var(--mute); margin-top:6px; text-align:center; }

  #help { bottom:12px; left:12px; padding:7px 11px; font-size:12px; color:var(--mute); line-height:1.5; }
  #help b { color:var(--ink); font-weight:600; }
  #help.min .full { display:none; }
  #help:not(.min) .mini { display:none; }

  #toast { position:absolute; left:50%; bottom:150px; transform:translateX(-50%); padding:10px 18px; font-size:15px; display:none; text-align:center; }
  #toast .dice { display:flex; gap:6px; justify-content:center; margin:6px 0 2px; }
  #toast .d { width:30px; height:30px; border-radius:6px; background:#f3efe6; color:#111; font-weight:700; display:flex; align-items:center; justify-content:center; }
  #toast .d.hit { background:#7fd18b; } #toast .d.one { background:#ff7a6b; }

  /* overlays */
  .overlay { position:absolute; inset:0; background:#05070acc; display:none; align-items:center; justify-content:center; backdrop-filter:blur(3px); z-index:10; }
  .overlay.open { display:flex; }
  #reader { gap:28px; }
  #reader img { max-height:86vh; max-width:52vw; border-radius:14px; box-shadow:0 10px 50px #000; }
  .txt { max-width:380px; font-size:16px; line-height:1.5; }
  .txt h2 { margin:0 0 4px; font-size:26px; }
  .txt .type { color:var(--acc); font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:14px; }
  .txt .flavor { color:var(--mute); font-style:italic; margin-top:14px; }
  .txt .btns { margin-top:22px; display:flex; gap:8px; flex-wrap:wrap; }

  .dialog { background:#151a21; border:1px solid #2b3440; border-radius:14px; padding:22px 26px; max-width:min(1100px, 94vw); max-height:92vh; overflow:auto; box-shadow:0 10px 60px #000; text-align:center; }
  .dialog h2 { margin:0 0 6px; }
  .dialog .note { color:var(--mute); margin-bottom:14px; }
  .cards { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:10px 0 18px; }
  .cards img { width:200px; border-radius:10px; cursor:pointer; border:3px solid transparent; transition:transform .12s; }
  .cards.static img { cursor:default; }
  .cards img:hover { transform:translateY(-4px); }
  .cards img.sel { border-color:var(--acc); box-shadow:0 0 18px #ffb34788; }
  .dialog .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .diff { display:flex; gap:8px; justify-content:center; margin:6px 0 16px; }
  .diff button.sel { border-color:var(--acc); background:#3a2c18; }
  .big { font-size:48px; margin:0; }
  #labelsBtn.on, #panelsBtn.on { border-color:var(--acc); }
  #panelsBtn:not(.on) { background:#b5651d; border-color:#e08a3a; }
  #goals { cursor:pointer; border-radius:6px; }
  #goals:hover { background:#ffffff08; }
  #goals .hint { color:var(--acc); font-size:11px; float:right; }
  .mroute { text-align:left; margin-top:14px; }
  .mroute h3 { margin:0 0 8px; font-size:15px; }
  .mstep { display:flex; gap:14px; align-items:center; background:#1d242d; border:1px solid #2b3440; border-left:4px solid #555; border-radius:10px; padding:10px; margin-bottom:8px; }
  .mstep.done { border-left-color:var(--good); opacity:.75; }
  .mstep.ready { border-left-color:var(--acc); box-shadow:0 0 14px #ffb34733; }
  .mstep img { width:150px; border-radius:6px; flex:none; }
  .mstep .mtxt { flex:1; font-size:13.5px; }
  .mstep ul { margin:4px 0; padding-left:4px; list-style:none; }
  .mstep li.ok { color:var(--good); } .mstep li.no { color:var(--bad); }
  .mhead { display:flex; justify-content:space-between; align-items:center; font-size:15px; }
  .chip { font-size:11px; letter-spacing:.1em; padding:2px 8px; border-radius:10px; background:#2a323c; color:var(--mute); }
  .mstep.done .chip { background:#1f4a2a; color:var(--good); } .mstep.ready .chip { background:#4a3415; color:var(--acc); }
  .msub { color:var(--mute); font-size:12.5px; }
  .mtable { width:100%; border-collapse:collapse; font-size:13px; }
  .mtable th, .mtable td { text-align:left; padding:5px 8px; border-bottom:1px solid #2b3440; }
  .mtable th { color:var(--mute); font-weight:600; }

  /* top-bar buttons carry an icon + a label; phones show only the icon */
  #top .ico { display:none; }
  #hud, #tabs { display:none; }

  /* ---------------------------------------------------------------- phones (body.phone set by main.js) */
  body.phone { -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body.phone canvas#gl { height:100dvh; }
  body.phone button { padding:8px 10px; font-size:14px; }
  body.phone #top { top:calc(6px + env(safe-area-inset-top)); left:6px; right:6px; padding:5px 6px; gap:5px; justify-content:space-between; }
  body.phone #top h1, body.phone #top .t, body.phone #panelsBtn, body.phone #missionsBtn { display:none; }
  body.phone #top .ico { display:inline; }
  body.phone #top button { flex:1; padding:7px 0; font-size:17px; }
  body.phone #help, body.phone #preview { display:none !important; }

  /* one-line status strip under the top bar */
  body.phone #hud { display:flex; position:absolute; top:calc(56px + env(safe-area-inset-top)); left:6px; right:6px; padding:5px 10px; gap:10px;
                    justify-content:space-between; font-size:13.5px; white-space:nowrap; overflow:hidden; border-radius:8px; }
  #hud b { font-weight:700; }
  #hud .lo { color:var(--bad); }

  /* tab bar at the bottom */
  body.phone #tabs { display:flex; position:absolute; left:6px; right:6px; bottom:calc(6px + env(safe-area-inset-bottom)); padding:5px; gap:5px; z-index:5; }
  #tabs button { flex:1; display:flex; flex-direction:column; align-items:center; gap:1px; padding:6px 0; font-size:12px; }
  #tabs button .i { font-size:19px; line-height:1.1; }
  #tabs button.on { background:#3a2c18; border-color:var(--acc); }
  #tabs button.alert { border-color:var(--bad); box-shadow:0 0 10px #ff7a6b66; }

  /* status, actions and backpack become sheets: only the chosen one shows */
  body.phone #status, body.phone #actions, body.phone #hand { display:none; left:6px; right:6px; top:auto; width:auto; z-index:4;
        bottom:calc(70px + env(safe-area-inset-bottom)); max-height:52dvh; overflow-y:auto; }
  body.phone[data-sheet=status] #status, body.phone[data-sheet=actions] #actions, body.phone[data-sheet=hand] #hand { display:flex; }
  body.phone #status #log { min-height:120px; max-height:none; }
  body.phone .opt { padding:9px 10px; }
  body.phone .opt .l { font-size:15px; } body.phone .opt .s { font-size:12.5px; }
  body.phone #hand { flex-direction:column; align-items:stretch; padding:8px; }
  body.phone #hand .lbl { writing-mode:horizontal-tb; transform:none; margin-bottom:6px; }
  body.phone #handCards { flex-wrap:wrap; justify-content:center; }
  body.phone #hand img { width:calc(33% - 6px); max-width:150px; }
  body.phone #hand img:hover { transform:none; }

  body.phone #toast { bottom:auto; top:calc(92px + env(safe-area-inset-top)); width:max-content; max-width:92vw; z-index:6; }

  /* reader: picture above the text, scrolls */
  body.phone #reader { flex-direction:column; justify-content:flex-start; gap:12px; overflow-y:auto; padding:calc(14px + env(safe-area-inset-top)) 14px 24px; }
  body.phone #reader img { max-width:92vw !important; max-height:46dvh; flex:none; }
  body.phone .txt { max-width:92vw; font-size:15px; }
  body.phone .txt h2 { font-size:22px; }
  body.phone .txt .btns button { flex:1 1 45%; padding:11px 8px; }

  /* dialogs */
  body.phone .dialog { padding:14px 12px; max-width:96vw; max-height:94dvh; }
  body.phone .cards { gap:8px; }
  body.phone .cards img { max-width:43vw; height:auto; }
  body.phone .cards img:only-child { max-width:68vw; }
  body.phone .diff { flex-wrap:wrap; }
  body.phone .mstep { flex-wrap:wrap; gap:8px; }
  body.phone .mstep img { width:96px; }
  body.phone .mstep .mtxt { min-width:180px; }
  body.phone .mstep > button { width:100%; }
  body.phone .mroute { overflow-x:auto; }
  body.phone .mtable { font-size:12px; }

  /* phone held sideways: sheets dock on the right instead of the bottom */
  body.phone.land #top { right:auto; width:min(60vw, 440px); }
  body.phone.land #hud { top:auto; bottom:calc(6px + env(safe-area-inset-bottom)); right:auto; width:min(60vw, 440px); }
  body.phone.land #tabs { left:auto; right:calc(6px + env(safe-area-inset-right)); top:calc(6px + env(safe-area-inset-top)); bottom:auto; width:min(38vw, 330px); }
  body.phone.land #status, body.phone.land #actions, body.phone.land #hand { left:auto; right:calc(6px + env(safe-area-inset-right)); width:min(38vw, 330px);
        top:calc(62px + env(safe-area-inset-top)); bottom:calc(6px + env(safe-area-inset-bottom)); max-height:none; }
  body.phone.land #hand img { width:calc(50% - 6px); }
  body.phone.land #toast { top:calc(60px + env(safe-area-inset-top)); left:32%; }
  body.phone.land #reader { flex-direction:row; align-items:flex-start; }
  body.phone.land #reader img { max-width:46vw !important; max-height:88dvh; }
  body.phone.land .txt { max-width:46vw; }
  body.phone.land .cards img { width:auto !important; max-height:50dvh; max-width:22vw; }
  body.phone.land .cards img:only-child { max-width:40vw; }
  body.phone.land .dialog { padding:10px 14px; }
  body.phone.land .dialog h2 { font-size:19px; margin:0; }
  body.phone.land .dialog .note { margin-bottom:6px; }
  body.phone.land .cards { margin:4px 0 8px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top" class="panel">
  <h1>WHITEOUT</h1>
  <button data-view="overview" title="Overview (key 1)"><span class="ico">🗺</span><span class="t">Overview</span></button>
  <button data-view="top" title="Top-down (key 2)"><span class="ico">⬇</span><span class="t">Top-down</span></button>
  <button data-view="player" title="My area (key 3)"><span class="ico">🃏</span><span class="t">My area</span></button>
  <button data-view="survivor" title="Find me (key 4)"><span class="ico">📍</span><span class="t">Find me</span></button>
  <button id="missionsBtn" title="Missions (key M)"><span class="ico">🎯</span><span class="t">🎯 Missions</span></button>
  <button id="labelsBtn" class="on" title="Labels (key L)"><span class="ico">🏷</span><span class="t">🏷 Labels</span></button>
  <button id="panelsBtn" class="on" title="Key H">▤ Panels</button>
  <button id="menuBtn" title="Menu"><span class="ico">☰</span><span class="t">Menu</span></button>
</div>
<div id="hud" class="panel"></div>
<nav id="tabs" class="panel">
  <button data-sheet="actions"><span class="i">🎲</span><span id="tabActLbl">Actions</span></button>
  <button data-sheet="status"><span class="i">❤</span>Status</button>
  <button data-sheet="hand"><span class="i">🎒</span><span id="tabHandLbl">Pack</span></button>
  <button id="tabMissions"><span class="i">🎯</span>Missions</button>
</nav>

<div id="status" class="panel">
  <div class="who"><b id="sName">—</b><span id="sRole"></span></div>
  <div class="meters" id="meters"></div>
  <div class="storm" id="stormTxt"></div>
  <div class="goals" id="goals"></div>
  <div id="log"></div>
</div>

<div id="actions" class="panel"></div>
<div id="hand" class="panel"><span class="lbl">BACKPACK</span><div id="handCards" style="display:flex;gap:8px"></div></div>
<div id="preview" class="panel"><img alt=""><div class="cap">Click to read</div></div>
<div id="toast" class="panel"></div>
<div id="help" class="panel min">
  <span class="mini"><b>?</b> Controls</span>
  <span class="full"><b>Left-drag</b> rotate · <b>Right-drag</b>/<b>WASD</b> pan · <b>Wheel</b> zoom · <b>Q/E</b> turn · <b>1–4</b> views · <b>H</b> hide panels<br>
  <b>Hover</b> preview · <b>Click</b> card/tile to read · <b>Double-click</b> tile to fly there · blue tiles = where you can move</span>
</div>

<div id="reader" class="overlay"><img alt=""><div class="txt"></div></div>
<div id="modal" class="overlay"><div class="dialog"></div></div>

<!--SCRIPT-->
</body>
</html>
